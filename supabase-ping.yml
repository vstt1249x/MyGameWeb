name: Ping Supabase Keep-Alive

on:
  schedule:
    - cron: '0 0 */3 * *' # Chạy tự động mỗi 3 ngày một lần vào lúc 00:00 UTC
  workflow_dispatch: # Cho phép chạy thủ công để kiểm tra

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Request to Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
